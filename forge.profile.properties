# Forge Profile Properties
# This custom profile redirects all user data paths to be relative to the application's
# working directory (/app), ensuring the simulation can find decks and other resources.

# Path to the user's home directory for Forge data. A single dot (.) means the current working directory.
forge.user.dir=.

# Path to the user's decks directory.
forge.decks.dir=./decks

# Path to the user's constructed decks subdirectory.
forge.decks.constructed.dir=./decks/constructed

# All other paths can be left as default as they will resolve relative to the user.dir.
